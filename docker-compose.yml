services:
  postgres:
    image: postgres:17-alpine
    container_name: everfit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-everfit_workout}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c max_connections=150
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-everfit_workout}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
